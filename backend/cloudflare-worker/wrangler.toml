name = "xtorin-ai-cloud"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Cloudflare-hosted LLM, no Groq key needed.
[ai]
binding = "AI"

# Approximate rate limit: 10 requests/minute per source IP / Cloudflare location.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 10
period = 60

# Match the Cloudflare dashboard's production logging settings.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
