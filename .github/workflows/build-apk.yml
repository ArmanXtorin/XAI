name: Build Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Check Windows companion Python syntax
        run: python3 -m py_compile windows/companion.py
      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check --input-type=module < backend/cloudflare-worker/src/index.js
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: XtorinAI-Mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
